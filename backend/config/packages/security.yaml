security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        # 4 tiers d'accès. Chaque niveau "contient" le précédent :
        #   ROLE_USER       = accès mobile uniquement
        #   ROLE_EDITEUR    = + Communication & Configuration (backend)
        #   ROLE_ENTRAINEUR = + Entraînements & Présences staff
        #   ROLE_ADMIN      = + Adhérents & Charte du club (tout)
        ROLE_EDITEUR: ROLE_USER
        ROLE_ENTRAINEUR: ROLE_EDITEUR
        ROLE_ADMIN: ROLE_ENTRAINEUR

    providers:
        # Provider custom qui implémente PayloadAwareUserProviderInterface :
        # Lexik lui transmet le payload JWT complet et notre provider load
        # par le claim `uid` (garantit le compte exact identifié par le
        # JWT — parent ou dépendant partageant l'email). Le fallback par
        # email (loadUserByIdentifier) sert au form_login admin classique
        # + au refresh sans payload, et retourne le PRIMAIRE de l'email.
        app_user_provider:
            id: App\Security\JwtUidAwareUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api_login:
            pattern: ^/api/auth/login$
            stateless: true
            json_login:
                check_path: api_login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api_refresh:
            pattern: ^/api/auth/refresh$
            stateless: true
            refresh_jwt:
                check_path: api_token_refresh

        api_public:
            pattern: ^/api/(auth/(magic-link|register-parent|register-member|email-change)|banner/active|public)
            stateless: true
            security: false

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

        admin:
            pattern: ^/admin
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                username_parameter: email
                password_parameter: password
                default_target_path: admin_dashboard
                enable_csrf: true
            logout:
                path: admin_logout
                target: admin_login

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin/logout, roles: PUBLIC_ACCESS }
        # Accès au backend = tout user avec au moins ROLE_EDITEUR.
        # Le filtrage section-par-section est fait par setEntityPermission
        # sur chaque CRUD et par setPermission sur les MenuItem.
        - { path: ^/admin, roles: ROLE_EDITEUR }
        - { path: ^/api/auth, roles: PUBLIC_ACCESS }
        - { path: ^/api/banner/active, roles: PUBLIC_ACCESS }
        # Doc/entrypoint API Platform (Swagger UI, OpenAPI JSON, contexts
        # JSON-LD) : aucune ressource n'y est mappée (src/Entity n'a aucun
        # #[ApiResource]), mais ça reste de la tuyauterie interne à ne pas
        # laisser naviguer par n'importe quel compte connecté — réservé
        # admin. Les vraies routes API (auth, me, events...) ont toujours
        # un segment après /api et ne matchent pas cette règle.
        - { path: ^/api(/docs|/contexts)?(\.[\w+-]+)?$, roles: ROLE_ADMIN }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
